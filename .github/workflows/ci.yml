name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # @criblio packages are public on npmjs — no packages: read, no registry
  # token, and no .npmrc routing (an app still pinned to GitHub Packages
  # would keep all three; this one moved to the published packages).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Registry mode: no `framework-sha`, so the action skips the
      # pinned-clone step. The action generates/refreshes
      # package-lock.json in CI before `npm ci`, so `@criblio` (and
      # everything else) is resolved against a lockfile that is never
      # committed here — this app carries no lockfile by design, and
      # nothing in the app creates one.
      #
      # The ref below is still a SHA — that pins the ACTION, which is
      # supply-chain hygiene every other step here follows (and which
      # `npm run security:static` enforces), not a framework source
      # dependency.
      # Temporary diagnostics step: runs eslint itself so the full warning
      # list is the tail of the failed step's log (the release-build action
      # summarizes lint failures but buries the per-warning lines above the
      # excerpt window). Removed once the lint regression is resolved.
      - name: ESLint diagnostics (verbose, fails on warnings)
        run: |
          npm install --no-audit --no-fund
          set +e
          npx eslint . --max-warnings 0 > eslint-report.txt 2>&1
          code=$?
          set -e
          cat eslint-report.txt
          if [ "$code" -ne 0 ]; then
            # Mirror the report into the run summary so the warnings are
            # readable on the run page without opening logs.
            {
              echo '## ESLint warnings (max-warnings=0 gate)'
              echo '```'
              cat eslint-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Compact, one violation per line, printed ABSOLUTELY LAST so the
          # bounded log tail captures the actual warnings (file:line:col
          # severity message rule-name).
          grep -E '(warning|error)' eslint-report.txt | tail -n 40 || true
          if [ "$code" -ne 0 ]; then exit 1; fi
      - uses: criblio/cribl-search-app-framework/.github/actions/release-build@965a5fc5b64aac5da2ddca16105280209fdb1093
      - name: Retain exact tested candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: build/*
          if-no-files-found: error
          retention-days: 14
