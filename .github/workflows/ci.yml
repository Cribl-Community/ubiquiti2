name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # @criblio packages are public on npmjs — no packages: read, no registry
  # token, and no .npmrc routing (an app still pinned to GitHub Packages
  # would keep all three; this one moved to the published packages).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Registry mode: no `framework-sha`, so the action skips the
      # pinned-clone step. The action generates/refreshes
      # package-lock.json in CI before `npm ci`, so `@criblio` (and
      # everything else) is resolved against a lockfile that is never
      # committed here — this app carries no lockfile by design, and
      # nothing in the app creates one.
      #
      # The ref below is still a SHA — that pins the ACTION, which is
      # supply-chain hygiene every other step here follows (and which
      # `npm run security:static` enforces), not a framework source
      # dependency.
      # NOTE: a temporary eslint-diagnostics step used to live here
      # (verbose lint output to locate the single unused-disable-directive
      # warning); removed 2026-09-11 after fixing src/main.tsx:12. If lint
      # regresses, `npx eslint . --max-warnings 0 --format json` reproduces it.
      - uses: criblio/cribl-search-app-framework/.github/actions/release-build@965a5fc5b64aac5da2ddca16105280209fdb1093
      # Temporary: vitest reports the cause ABOVE its summary lines, so a
      # plain log tail shows only "Tests no tests". Re-run the suite here and
      # print the first few cause lines LAST so the bounded excerpt sees them.
      # Removed once tests are green.
      - name: Test failure diagnostics
        if: failure()
        run: |
          npx vitest run --reporter=verbose > vitest.log 2>&1 || true
          tail -n 3 vitest.log || true
          grep -n -E "Failed to load|Cannot find|is not exported|SyntaxError|ReferenceError|TypeError|Error:" vitest.log | head -n 4 || true
      - name: Retain exact tested candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: build/*
          if-no-files-found: error
          retention-days: 14
