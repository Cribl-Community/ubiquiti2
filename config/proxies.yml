# External API declarations for the Cribl App Platform fetch proxy.
# GoatTown server-side investigator. The bearer token is injected here
# from the app KV credential `goattownEmbedToken` (set by an admin) and
# never passes through browser code. If the deployment uses a different
# GoatTown host, it must be declared here and the app repackaged.
goattown-shared.lab.cribl.io:
  timeout: 30000
  headers:
    inject:
      authorization: "'Bearer ' + kv.goattownEmbedToken"
    allowlist:
      - content-type
      - accept
      - x-goattown-user
