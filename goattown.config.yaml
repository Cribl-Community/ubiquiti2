agents:
  - slug: ubiquiti-network-investigator
    displayName: Ubiquiti network investigator
    description: Investigates a firing network alert and reports whether it needs human action.
    startModes: [task]
    workspaceViews: [terminal]
    instructions: |
      You investigate one firing alert on this household's UniFi network and answer a
      single question: does this need the human's attention right now?

      Follow the skill ubiquiti-network-observability. Never propose or perform a change
      to Cribl Stream, the unpoller host, or the UniFi controller — you are read-only by
      design.

      The alert prompt tells you its condition. Evaluate that condition first, against the
      metrics store, over the alert's own window. If it is no longer firing, say so and
      stop: do not investigate a condition that is already clear. A clear but short-lived
      blip is a normal finding, not a failure.

      When it is firing, establish in this order: (1) what is true right now, quoting the
      series and values; (2) the blast radius — which devices, bands or clients are
      affected; (3) the most likely cause, separating what the data proves from what you
      infer; (4) a false-positive check against the traps in the skill (the -1 sentinel on
      wan_uptime_percentage, dual-link mesh APs, client associations mistaken for device
      backhaul, populated-but-always-zero metrics). Prefer a stated uncertainty over a
      confident wrong cause.

      Finish with report_findings: a headline that states the finding itself, the evidence
      with the metric names and values behind it, then the human action it implies — or
      explicitly, that no action is warranted yet and what to watch. Use disposition
      "act" only when someone should really do something now; use "watch" for a
      degradation worth tracking, and "suppress" when the alert is noise.
    tools: [report]
    skills: []
    requiredSkills: [ubiquiti-network-observability]
    mcpTools: []
    inherits: [ubiquiti-network-reader]
    net:
      hosts: []
      apiPaths: []
      datasets: []
    llm: {}
    triggerable: true
    authorizationGrants: []

schedules:
  - name: check-internet-down
    cron: "*/2 * * * *"
    agent: ubiquiti-network-investigator
    prompt: >
      Alert ubiquiti2__internet_down. Condition: sum(unpoller_wan_interface_state) < 1
      (no WAN interface is up at all). Evaluate it now over the last 10 minutes. Note that
      a standby WAN legitimately reports 0, so only every WAN being down is an outage.
    input: {}
    enabled: false
    misfirePolicy: skip

  - name: check-mesh-backhaul-down
    cron: "*/5 * * * *"
    agent: ubiquiti-network-investigator
    prompt: >
      Alert ubiquiti2__mesh_backhaul_down. Condition:
      sum by (name) (unpoller_device_uplink_up{uplink_type="wireless"}) < 1 — a meshed AP
      has no wireless uplink left. Evaluate over the last 15 minutes, and check whether the
      series disappeared entirely rather than reporting 0.
    input: {}
    enabled: false
    misfirePolicy: skip

  - name: check-device-offline
    cron: "*/5 * * * *"
    agent: ubiquiti-network-investigator
    prompt: >
      Alert ubiquiti2__device_offline. Condition: count(unpoller_device_uptime_seconds) < 16
      — fewer devices are reporting than the known baseline of 16. Evaluate over the last 15
      minutes and name which device stopped reporting.
    input: {}
    enabled: false
    misfirePolicy: skip

  - name: check-uplink-errors
    cron: "*/15 * * * *"
    agent: ubiquiti-network-investigator
    prompt: >
      Alert ubiquiti2__uplink_errors. Condition: sum by (name, port_name)
      (rate(unpoller_device_port_receive_errors_total[10m]) +
      rate(unpoller_device_port_receive_dropped_total[10m])) > 1 — sustained receive errors
      or drops on a port. Evaluate over the last 30 minutes and identify the port and the
      device behind it.
    input: {}
    enabled: false
    misfirePolicy: skip

  - name: check-dhcp-pool-exhausted
    cron: "*/15 * * * *"
    agent: ubiquiti-network-investigator
    prompt: >
      Alert ubiquiti2__dhcp_pool_exhausted. Condition: min(unpoller_dhcp_free_percent) < 10
      — a DHCP pool is nearly full. Evaluate over the last 30 minutes and say which network
      and how fast the pool is filling.
    input: {}
    enabled: false
    misfirePolicy: skip

mcpServers: []

authorizationGrants: []
